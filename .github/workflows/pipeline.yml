name: Reusable application pipeline
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Full Simple-pipe commit SHA; pin the same SHA as the caller uses
        type: string
        required: true
      deploy:
        description: Explicit opt-in, in addition to the main push gate
        type: boolean
        default: false
      runner:
        description: JSON runner labels; use a dedicated network runner for private servers
        type: string
        default: '"ubuntu-24.04"'
    secrets:
      TOOLKIT_READ_TOKEN:
        description: Read-only contents token for private cross-repository toolkit checkout
        required: false
      DEPLOY_HOST:
        required: false
      DEPLOY_USER:
        required: false
      DEPLOY_PORT:
        required: false
      DEPLOY_DIRECTORY:
        required: false
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_KNOWN_HOSTS:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: omarbenhammou/Simple-pipe
          token: ${{ secrets.TOOLKIT_READ_TOKEN || github.token }}
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false
      - name: Test and build application release
        working-directory: app
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .simple-pipe/ci.sh
          python3 ../toolkit/simple_pipe.py build --sha "$RELEASE_SHA"
      - name: Retain release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ github.sha }}
          path: app/dist/release.tar.gz
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: verify
    if: inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    environment: production
    concurrency:
      group: simple-pipe-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: omarbenhammou/Simple-pipe
          token: ${{ secrets.TOOLKIT_READ_TOKEN || github.token }}
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false
      - name: Download this run's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
        run: gh run download "$RUN_ID" --name "release-$RELEASE_SHA" --dir release
      - name: Deploy with pinned SSH host verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          temp=$(mktemp -d)
          trap 'rm -rf -- "$temp"' EXIT
          chmod 700 "$temp"
          printf '%s\n' "$SSH_KEY" > "$temp/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$temp/known_hosts"
          chmod 600 "$temp/key" "$temp/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          export DEPLOY_KEY_FILE="$temp/key" DEPLOY_KNOWN_HOSTS_FILE="$temp/known_hosts"
          python3 toolkit/simple_pipe.py send --release release/release.tar.gz
